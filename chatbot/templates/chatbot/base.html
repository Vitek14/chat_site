{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Лекция-чатбот{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    html, body { height: 100%; }
    body {
      background: #eef2f6;
      height: 100dvh;
      overflow: hidden;
    }
    .page-wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .chat-card {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .chat-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      background: #f8f9fa;
    }
    .msg { display: flex; gap: .6rem; margin-bottom: .9rem; }
    .msg.user { flex-direction: row-reverse; }
    .bubble {
      background: #fff; border-radius: 1rem; padding: .7rem .9rem; max-width: 82%;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow-wrap: break-word;
    }
    .msg.user .bubble { background: #0d6efd; color: #fff; }
    .msg.user .bubble a { color: #cfe2ff; }
    .bubble img { max-width: 100%; max-height: 240px; width: auto; border-radius: .6rem; margin-top: .5rem; }
    .bubble pre { white-space: pre-wrap; font-size: .82rem; }
    .bubble table { font-size: .85rem; }
    .avatar {
      width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }
    .avatar.user { background: #0d6efd; }
    .typing span {
      display: inline-block; width: 7px; height: 7px; margin-right: 3px;
      border-radius: 50%; background: #6c757d; animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .card-header, .card-footer { flex-shrink: 0; }
    #buttons { min-height: 44px; }
    .btn-choose { border-radius: 999px; }
    @media (max-width: 575.98px) {
      .bubble { max-width: 90%; }
      .card-header h5 { font-size: 1rem; }
    }
  </style>
</head>
<body>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
