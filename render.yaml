services:
  - type: web
    name: chat-bot-lecture
    runtime: python
    plan: free
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync --frozen
      uv run python manage.py migrate
      uv run python manage.py collectstatic --noinput
      uv run python manage.py load_scenario
    startCommand: uv run gunicorn config.wsgi:application --chdir .
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_PATH
        value: /var/data/db.sqlite3
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
